[platformio]
default_envs = m5stickc
; Wi-Fi network settings; copy secrets.ini.example to create it.
extra_configs = secrets.ini

; Defaults for the optional settings in secrets.ini (which overrides these).
; wifi_ssid and wifi_password have no defaults: secrets.ini must set them.
[secrets]
static_ip =
gateway =
subnet = 255.255.255.0

[env:m5stickc]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The M5StickC's FTDI link is unreliable above 115200.
upload_speed = 115200
board_build.embed_txtfiles = web/index.html
build_flags =
    ; Single-quoted so values may contain spaces.
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASSWORD="${secrets.wifi_password}"'
    '-DSTATIC_IP="${secrets.static_ip}"'
    '-DGATEWAY="${secrets.gateway}"'
    '-DSUBNET="${secrets.subnet}"'
    ; One frame in flight per viewer; newer frames are dropped until it's sent.
    -DWS_MAX_QUEUED_MESSAGES=1
    ; Keep core 1 free for the Lepton capture task.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    ; M5StickT (StickC with ST7789 240x135 screen and FLIR Lepton); not in the registry.
    https://github.com/m5stack/M5-StickT.git#a502cb40e0837bccd55a3e09389f3cbfc155cea8
    esp32async/ESPAsyncWebServer@3.12.0
    esp32async/AsyncTCP@3.5.0
