[platformio]
default_envs = m5stickc

[env:m5stickc]
; pioarduino: the maintained continuation of the ESP32 platform, with Arduino
; core 3.3.12 on ESP-IDF 5.5.5 (PlatformIO's own stops at core 2.0.17).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stick-c
; The board file still names the core 2.x variant; core 3.x renamed it.
board_build.variant = m5stack_stickc
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The M5StickC's FTDI link is unreliable above 115200.
upload_speed = 115200
board_build.embed_txtfiles = web/index.html
build_flags =
    ; One frame in flight per viewer; newer frames are dropped until it's sent.
    -DWS_MAX_QUEUED_MESSAGES=1
    ; Keep core 1 free for the Lepton capture task.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; AsyncTCP's default 16 KB stack is far more than our handlers need, and
    ; core 3.x leaves little RAM to spare.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
lib_deps =
    esp32async/ESPAsyncWebServer@3.12.0
    esp32async/AsyncTCP@3.5.0
