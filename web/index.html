<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>M5 Thermal</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #17191e;
    --panel-2: #1f2229;
    --line: #2a2e37;
    --text: #e8e9ec;
    --muted: #8b909c;
    --accent: #ff8a1f;
    --hot: #ff4d3d;
    --cold: #4da3ff;
    --ok: #3ecf6e;
    --warn: #f0b429;
    --radius: 12px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 16px; white-space: nowrap; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .status { display: flex; align-items: center; gap: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  .dot.live { background: var(--ok); }
  .dot.bad { background: var(--hot); }

  .icon-btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    width: 36px; height: 36px; border-radius: 9px; display: inline-grid; place-items: center;
    cursor: pointer; padding: 0;
  }
  .icon-btn:hover { border-color: #3a404c; }
  .icon-btn svg { width: 18px; height: 18px; display: block; }

  /* The display: one canvas laid out like the device's 240x135 screen. */
  .stage { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; }
  canvas#view { display: block; margin: 0 auto; touch-action: none; cursor: crosshair; }
  .overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); color: var(--text); font-size: 15px; text-align: center; padding: 16px;
    pointer-events: none;
  }
  .overlay.show { display: flex; }
  /* Bottom-right is empty on the panel (beside the min label). */
  .fs-controls { position: absolute; bottom: 10px; right: 10px; display: none; gap: 8px; }
  .fs-controls .icon-btn { background: rgba(23,25,30,.75); backdrop-filter: blur(4px); }

  /* Fullscreen: the stage fills the screen. On a portrait screen that can't be
     locked to landscape, it's rotated a quarter turn (sized from JS). */
  .stage.fs { position: fixed; inset: 0; z-index: 10; border-radius: 0; display: grid; place-items: center; }
  .stage.fs .fs-controls { display: flex; }
  .stage.fs.rot { inset: auto; top: 0; left: 0; transform-origin: top left; }
  body.fs-active { overflow: hidden; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; min-height: 36px;
  }
  .btn:hover { border-color: #3a404c; }
  .btn.rec { border-color: var(--hot); color: var(--hot); }
  .fine { color: var(--muted); font-size: 12px; }
  #info { margin: 10px 0 0; }

  /* Settings overlay */
  dialog {
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text);
    padding: 0; width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .dlg-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .dlg-body { padding: 8px 16px 16px; display: grid; gap: 16px; }
  .group > .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer; min-height: 34px;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=number] {
    width: 100%; min-width: 0; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 8px; font: inherit;
  }
  .row input:disabled { opacity: .45; }
  @media (max-width: 520px) { #fps { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>M5 Thermal</h1>
    <div class="status">
      <span><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></span>
      <span id="fps">– fps</span>
      <span id="battText" title="Battery"></span>
      <button class="icon-btn" id="bSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="bFullscreen" title="Fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="overlay show" id="overlay">Connecting to camera…</div>
    <div class="fs-controls">
      <button class="icon-btn" id="bSettingsFs" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="bExitFs" title="Exit fullscreen" aria-label="Exit fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="bSnap">Snapshot</button>
    <button class="btn" id="bRec">Record</button>
    <button class="btn" id="bCsv">Save temperatures (CSV)</button>
  </div>
  <p class="fine" id="info">Tap or hover the image to probe a point.</p>
</main>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="dlg-head">
    <h2 id="settingsTitle">Settings</h2>
    <button class="icon-btn" id="bCloseSettings" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-body">
    <div class="group">
      <div class="label">Palette</div>
      <div class="seg" id="palettes"></div>
    </div>
    <div class="group">
      <div class="label">Range</div>
      <div class="seg" style="margin-bottom:8px">
        <button data-range="auto">Auto</button>
        <button data-range="manual">Manual</button>
      </div>
      <div class="row">
        <input type="number" id="rMin" step="0.5" aria-label="Range minimum">
        <span class="fine">to</span>
        <input type="number" id="rMax" step="0.5" aria-label="Range maximum">
      </div>
    </div>
    <div class="group">
      <div class="label">View</div>
      <div class="seg">
        <button id="tUnits">°C</button>
        <button id="tSmooth">Smooth</button>
        <button id="tMirror">Mirror</button>
        <button id="tRotate">Rotate</button>
        <button id="tMarkers">Markers</button>
      </div>
    </div>
  </div>
</dialog>

<script>
(() => {
  const HEADER = 20;

  // ---- Palettes (Ironbow matches the device screen) ----
  const PALETTES = {
    Ironbow: [[0, 0, 0, 10], [.15, 45, 0, 120], [.32, 140, 0, 150], [.5, 215, 40, 70],
              [.65, 245, 110, 0], [.82, 255, 190, 0], [1, 255, 255, 230]],
    Rainbow: [[0, 20, 0, 120], [.2, 0, 90, 255], [.4, 0, 220, 220], [.6, 60, 220, 40],
              [.8, 255, 200, 0], [1, 255, 30, 0]],
    'White hot': [[0, 0, 0, 0], [1, 255, 255, 255]],
    'Black hot': [[0, 255, 255, 255], [1, 0, 0, 0]],
  };
  const lut = {};
  for (const [name, stops] of Object.entries(PALETTES)) {
    const t = new Uint8ClampedArray(256 * 3);
    for (let i = 0; i < 256; i++) {
      const p = i / 255;
      let s = 0;
      while (s < stops.length - 2 && p > stops[s + 1][0]) s++;
      const a = stops[s], b = stops[s + 1], f = (p - a[0]) / (b[0] - a[0]);
      for (let c = 0; c < 3; c++) t[i * 3 + c] = a[c + 1] + (b[c + 1] - a[c + 1]) * f;
    }
    lut[name] = t;
  }
  const lutColor = (L, i) => `rgb(${L[i * 3]},${L[i * 3 + 1]},${L[i * 3 + 2]})`;

  // ---- Settings (per-viewer, best effort) ----
  const defaults = { palette: 'Ironbow', range: 'auto', rMin: 20, rMax: 40, fahrenheit: false,
                     smooth: true, mirror: false, rotate: 0, markers: true };
  let S = { ...defaults };
  try { S = { ...defaults, ...JSON.parse(localStorage.getItem('m5thermal') || '{}') }; } catch {}
  const save = () => { try { localStorage.setItem('m5thermal', JSON.stringify(S)); } catch {} };

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const stage = $('stage'), view = $('view'), ctx = view.getContext('2d');
  const work = document.createElement('canvas'), workCtx = work.getContext('2d');

  const unit = () => S.fahrenheit ? '°F' : '°C';
  const toU = c => S.fahrenheit ? c * 9 / 5 + 32 : c;
  const fromU = u => S.fahrenheit ? (u - 32) * 5 / 9 : u;
  const fmt = c => c == null || isNaN(c) ? '–' : toU(c).toFixed(1) + unit();
  const fmtShort = c => c == null || isNaN(c) ? '–' : toU(c).toFixed(1) + '°';

  // ---- Frame state ----
  let frame = null;          // { w, h, t: Float32Array, min, max, ... } in view orientation, °C
  let lo = NaN, hi = NaN;    // current colour range, °C
  let probe = null;          // { x, y } in frame coords (0..w, 0..h), or null
  let lastMsg = 0, frames = 0, fpsT = performance.now();
  let battery = null;        // { pct, charging, usb }
  let frozen = false;        // The camera's freeze-frame button is on.

  // Apply mirror/rotation to the raw W x H grid.
  function orient(raw, W, H) {
    const rot = S.rotate, w = rot % 180 ? H : W, h = rot % 180 ? W : H;
    const t = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const sx = S.mirror ? W - 1 - x : x;
      let dx, dy;
      if (rot === 0) { dx = sx; dy = y; }
      else if (rot === 90) { dx = H - 1 - y; dy = sx; }
      else if (rot === 180) { dx = W - 1 - sx; dy = H - 1 - y; }
      else { dx = y; dy = W - 1 - sx; }
      t[dy * w + dx] = raw[y * W + x];
    }
    return { w, h, t };
  }

  // Bilinear sample at continuous coords (pixel centres at i + 0.5).
  function sample(f, x, y) {
    const fx = Math.min(Math.max(x - .5, 0), f.w - 1), fy = Math.min(Math.max(y - .5, 0), f.h - 1);
    const x0 = Math.min(fx | 0, f.w - 2), y0 = Math.min(fy | 0, f.h - 2), wx = fx - x0, wy = fy - y0;
    const a = f.t[y0 * f.w + x0], b = f.t[y0 * f.w + x0 + 1];
    const c = f.t[(y0 + 1) * f.w + x0], d = f.t[(y0 + 1) * f.w + x0 + 1];
    return (a + (b - a) * wx) + ((c + (d - c) * wx) - (a + (b - a) * wx)) * wy;
  }

  let rawLast = null;
  function ingest(raw) {
    rawLast = raw;
    frame = orient(raw.t, raw.w, raw.h);
    let minI = 0, maxI = 0;
    for (let i = 1; i < frame.t.length; i++) {
      if (frame.t[i] < frame.t[minI]) minI = i;
      if (frame.t[i] > frame.t[maxI]) maxI = i;
    }
    Object.assign(frame, { minI, maxI, min: frame.t[minI], max: frame.t[maxI] });
    if (S.range === 'auto') {
      // As on the device: follow the coldest and hottest pixels, smoothed,
      // and at least 2 degrees wide.
      if (isNaN(lo)) { lo = frame.min; hi = frame.max; }
      else { lo += (frame.min - lo) * .3; hi += (frame.max - hi) * .3; }
    } else { lo = S.rMin; hi = S.rMax; }
    draw();
  }

  function colourRange() {
    if (S.range !== 'auto') return [lo, Math.max(hi, lo + .1)];
    const mid = (lo + hi) / 2;
    return [Math.min(lo, mid - 1), Math.max(hi, mid + 1)];
  }

  // ---- Layout, in device screen units (the device is 240x135) ----
  // Image 160x120 (or 90x120 rotated) with a 4-unit margin, then a 72-unit panel.
  const H_UNITS = 135, IMG_H = 120, IMG_X = 4, IMG_Y = 7.5, PANEL_W = 72;
  function layout() {
    const w = frame ? frame.w : (S.rotate % 180 ? 120 : 160), h = frame ? frame.h : (S.rotate % 180 ? 160 : 120);
    const imgW = IMG_H * w / h, panelX = IMG_X + imgW + 4;
    return { imgW, panelX, totalW: panelX + PANEL_W };
  }

  // ---- Fullscreen ----
  let fsMode = false, rotated = false;

  function availableBox() {
    if (fsMode) {
      const W = innerWidth, H = innerHeight;
      return rotated ? { w: H, h: W } : { w: W, h: H };
    }
    const top = stage.getBoundingClientRect().top + scrollY;
    return { w: stage.clientWidth, h: Math.max(220, innerHeight - top - 90) };
  }

  // Display scale: CSS px per device unit.
  let cssScale = 1;

  // ---- Rendering ----
  function draw() {
    const L = layout(), box = availableBox();
    cssScale = Math.min(box.w / L.totalW, box.h / H_UNITS);
    const cssW = Math.floor(L.totalW * cssScale), cssH = Math.floor(H_UNITS * cssScale);
    const dpr = window.devicePixelRatio || 1;
    view.style.width = cssW + 'px'; view.style.height = cssH + 'px';
    const pw = Math.round(cssW * dpr), ph = Math.round(cssH * dpr);
    if (view.width !== pw || view.height !== ph) { view.width = pw; view.height = ph; }

    const k = pw / L.totalW;  // canvas px per unit
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, pw, ph);
    ctx.setTransform(k, 0, 0, k, 0, 0);

    const Lut = lut[S.palette];
    if (!frame) { drawPanel(L, null, Lut); return; }
    const f = frame, [cLo, cHi] = colourRange(), span = cHi - cLo;

    // Image.
    if (work.width !== f.w || work.height !== f.h) { work.width = f.w; work.height = f.h; }
    const img = workCtx.createImageData(f.w, f.h), px = img.data;
    for (let i = 0; i < f.t.length; i++) {
      const c = Math.max(0, Math.min(255, ((f.t[i] - cLo) / span * 255) | 0)) * 3, o = i * 4;
      px[o] = Lut[c]; px[o + 1] = Lut[c + 1]; px[o + 2] = Lut[c + 2]; px[o + 3] = 255;
    }
    workCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = S.smooth;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(work, IMG_X, IMG_Y, L.imgW, IMG_H);

    // Overlays, in image units.
    const sx = L.imgW / f.w, sy = IMG_H / f.h;
    const at = i => [IMG_X + (i % f.w + .5) * sx, IMG_Y + ((i / f.w | 0) + .5) * sy];
    if (S.markers) {
      triangle(...at(f.minI), false, getCss('--cold'));
      triangle(...at(f.maxI), true, getCss('--hot'));
    }
    crosshair(IMG_X + L.imgW / 2, IMG_Y + IMG_H / 2);
    if (probe) {
      const v = sample(f, probe.x, probe.y), x = IMG_X + probe.x * sx, y = IMG_Y + probe.y * sy;
      ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ring(x, y, 3.5);
      ctx.lineWidth = .9; ctx.strokeStyle = getCss('--accent'); ring(x, y, 3.5);
      imageLabel(fmt(v), x + 6, y + 2.5, L);
    }

    f.centre = sample(f, f.w / 2, f.h / 2);
    drawPanel(L, { f, cLo, cHi }, Lut);

    if (S.range === 'auto') {
      $('rMin').value = toU(cLo).toFixed(1);
      $('rMax').value = toU(cHi).toFixed(1);
    }
  }

  // Side panel, mirroring the device: centre temperature and battery at the
  // top, then max label, colour scale with histogram, min label.
  function drawPanel(L, st, Lut) {
    const x0 = L.panelX;
    drawBattery(x0 + PANEL_W - 18, 4);
    if (frozen) {
      // Pause icon below the battery, as on the device.
      ctx.fillStyle = '#fff';
      ctx.fillRect(x0 + PANEL_W - 15, 13, 3, 8);
      ctx.fillRect(x0 + PANEL_W - 9, 13, 3, 8);
    }
    // Crosshair icon.
    ctx.strokeStyle = '#fff'; ctx.lineWidth = .9;
    ctx.beginPath();
    ctx.moveTo(x0 + 1, 8.5); ctx.lineTo(x0 + 4, 8.5); ctx.moveTo(x0 + 7, 8.5); ctx.lineTo(x0 + 10, 8.5);
    ctx.moveTo(x0 + 5.5, 3); ctx.lineTo(x0 + 5.5, 6); ctx.moveTo(x0 + 5.5, 11); ctx.lineTo(x0 + 5.5, 14);
    ctx.stroke();

    ctx.textBaseline = 'alphabetic';
    if (!st) { text('--', x0 + 13, 14, 13, '#8b909c', 600); return; }
    const { f, cLo, cHi } = st;
    fitText(fmtShort(f.centre), x0 + 13, 14, 13, x0 + PANEL_W - 25, '#fff', 600);

    const maxY = 22, histY = 33, histH = 86, minY = histY + histH + 4;
    panelTriangle(x0 + 6, maxY + 4, true, getCss('--hot'));
    fitText(fmtShort(f.max), x0 + 13, maxY + 7.5, 9, x0 + PANEL_W - 1, '#fff', 500);
    panelTriangle(x0 + 6, minY + 4, false, getCss('--cold'));
    fitText(fmtShort(f.min), x0 + 13, minY + 7.5, 9, x0 + PANEL_W - 1, '#fff', 500);

    // Histogram over the colour range, hottest at the top.
    const bins = histH, hist = new Uint32Array(bins), span = cHi - cLo;
    for (const v of f.t) hist[bins - 1 - Math.max(0, Math.min(bins - 1, ((v - cLo) / span * bins) | 0))]++;
    let peak = 1;
    for (const c of hist) peak = Math.max(peak, c);
    const scaleX = x0 + 5, scaleW = 5, barsX = scaleX + scaleW + 2, barMax = PANEL_W - (barsX - x0) - 1;
    // Rows are snapped to whole canvas pixels so they don't leave seams.
    const k = ctx.getTransform().a, px = v => Math.round(v * k);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let r = 0; r < bins; r++) {
      const y0 = px(histY + r), y1 = px(histY + r + 1);
      ctx.fillStyle = lutColor(Lut, 255 - Math.round(r * 255 / (bins - 1)));
      ctx.fillRect(px(scaleX), y0, px(scaleX + scaleW) - px(scaleX), y1 - y0);
      const len = hist[r] ? Math.max(.5, hist[r] / peak * barMax) : 0;
      if (len) ctx.fillRect(px(barsX), y0, Math.max(1, px(barsX + len) - px(barsX)), y1 - y0);
    }
    ctx.restore();

    // Pointer at the centre temperature on the scale.
    const py = histY + Math.max(0, Math.min(histH - 1, (cHi - f.centre) / span * (histH - 1))) + .5;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(scaleX - 1, py); ctx.lineTo(scaleX - 5, py - 3); ctx.lineTo(scaleX - 5, py + 3); ctx.fill();
  }

  function drawBattery(x, y) {
    const w = 15, h = 7;
    ctx.strokeStyle = '#c6c6c6'; ctx.lineWidth = .9;
    ctx.strokeRect(x + .45, y + .45, w - .9, h - .9);
    ctx.fillStyle = '#c6c6c6'; ctx.fillRect(x + w, y + 2, 1.6, h - 4);
    if (!battery) return;
    const pct = battery.pct;
    ctx.fillStyle = pct > 50 ? getCss('--ok') : pct > 20 ? getCss('--warn') : getCss('--hot');
    ctx.fillRect(x + 2, y + 2, Math.max(pct > 0 ? .8 : 0, (w - 4) * pct / 100), h - 4);
    if (battery.charging) {
      ctx.strokeStyle = getCss('--warn'); ctx.lineWidth = .9;
      ctx.beginPath(); ctx.moveTo(x - 3, y - 1); ctx.lineTo(x - 5, y + 3.5); ctx.lineTo(x - 3, y + 3.5); ctx.lineTo(x - 5, y + 8); ctx.stroke();
    }
  }

  function text(s, x, y, size, color, weight) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }
  // Shrinks the font if needed so the text ends before `maxX`.
  function fitText(s, x, y, size, maxX, color, weight) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    const w = ctx.measureText(s).width;
    if (x + w > maxX) size *= (maxX - x) / w;
    text(s, x, y, size, color, weight);
  }
  function panelTriangle(x, y, up, color) {
    ctx.fillStyle = color; ctx.beginPath();
    if (up) { ctx.moveTo(x, y - 3.5); ctx.lineTo(x + 3.5, y + 2.5); ctx.lineTo(x - 3.5, y + 2.5); }
    else { ctx.moveTo(x, y + 3.5); ctx.lineTo(x + 3.5, y - 2.5); ctx.lineTo(x - 3.5, y - 2.5); }
    ctx.fill();
  }
  // Image marker: triangle centred on the pixel, with a dark outline.
  function triangle(x, y, up, color) {
    ctx.beginPath();
    if (up) { ctx.moveTo(x, y - 3.5); ctx.lineTo(x + 3.5, y + 2.5); ctx.lineTo(x - 3.5, y + 2.5); }
    else { ctx.moveTo(x, y + 3.5); ctx.lineTo(x + 3.5, y - 2.5); ctx.lineTo(x - 3.5, y - 2.5); }
    ctx.closePath();
    ctx.lineWidth = 1.4; ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.fillStyle = color; ctx.fill();
  }
  function crosshair(x, y) {
    const seg = (w, c) => {
      ctx.lineWidth = w; ctx.strokeStyle = c; ctx.beginPath();
      ctx.moveTo(x - 8, y); ctx.lineTo(x - 3, y); ctx.moveTo(x + 3, y); ctx.lineTo(x + 8, y);
      ctx.moveTo(x, y - 8); ctx.lineTo(x, y - 3); ctx.moveTo(x, y + 3); ctx.lineTo(x, y + 8);
      ctx.stroke();
    };
    seg(2.2, 'rgba(0,0,0,.8)'); seg(1, '#fff');
  }
  function ring(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); }
  function imageLabel(s, x, y, L) {
    ctx.font = '600 7px system-ui, -apple-system, "Segoe UI", sans-serif';
    const w = ctx.measureText(s).width;
    if (x + w > IMG_X + L.imgW - 1) x -= w + 12;
    y = Math.max(IMG_Y + 7, Math.min(IMG_Y + IMG_H - 2, y));
    ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.strokeText(s, x, y);
    ctx.fillStyle = getCss('--accent'); ctx.fillText(s, x, y);
  }

  const cssCache = {};
  const getCss = n => cssCache[n] || (cssCache[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim());

  // ---- Status ----
  function setConn(state, text) {
    $('connDot').className = 'dot' + (state === 'live' ? ' live' : state === 'bad' ? ' bad' : '');
    $('connText').textContent = text;
  }
  function setOverlay(text) {
    $('overlay').textContent = text || '';
    $('overlay').classList.toggle('show', !!text);
  }
  function setBattery(pct, charging, usb) {
    battery = { pct, charging, usb };
    $('battText').textContent = `${pct}%${charging ? ' ⚡' : ''}`;
    $('battText').title = charging ? 'Charging' : usb ? 'On USB power' : 'On battery';
  }

  // ---- Frame decoding (see README) ----
  function decodeRaw(dv, w, h) {
    if (dv.byteLength < HEADER + w * h * 2) return null;
    const raw = new Uint16Array(w * h);
    for (let i = 0; i < w * h; i++) raw[i] = dv.getUint16(HEADER + i * 2, true);
    return raw;
  }
  // Zigzag deltas from the left neighbour (or the pixel above at row start);
  // one byte below 0x80, else two bytes with the top bit set.
  function decodeDelta(buf, w, h) {
    const u8 = new Uint8Array(buf), raw = new Uint16Array(w * h);
    let p = HEADER;
    for (let i = 0; i < w * h; i++) {
      if (p >= u8.length) return null;
      let z = u8[p++];
      if (z & 0x80) z = ((z & 0x7F) << 8) | u8[p++];
      const pred = i % w ? raw[i - 1] : i ? raw[i - w] : 0;
      raw[i] = pred + ((z >>> 1) ^ -(z & 1));
    }
    return raw;
  }

  // ---- WebSocket ----
  let ws, retry = 500;
  function connect() {
    setConn('', 'Connecting…');
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { retry = 500; setConn('live', 'Live'); };
    ws.onclose = () => {
      setConn('bad', 'Disconnected'); setOverlay('Connection lost — reconnecting…');
      setTimeout(connect, retry); retry = Math.min(retry * 2, 5000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = ev => {
      const dv = new DataView(ev.data);
      const version = dv.byteLength >= HEADER ? dv.getUint8(0) : 0;
      if (version !== 2 && version !== 3) return;
      const flags = dv.getUint8(1);
      const sensorOk = !!(flags & 1);
      frozen = !!(flags & 8);
      setBattery(dv.getUint8(2), !!(flags & 2), !!(flags & 4));
      lastMsg = performance.now();
      const w = dv.getUint16(8, true), h = dv.getUint16(10, true);
      const scale = dv.getFloat32(12, true), offset = dv.getFloat32(16, true);
      const raw = !sensorOk || !w ? null : version === 3 ? decodeDelta(ev.data, w, h) : decodeRaw(dv, w, h);
      if (!raw) {
        // Status-only messages (no pixels) also arrive while streaming.
        if (!sensorOk) setOverlay('Thermal camera starting…');
        return;
      }
      setOverlay('');
      // Radiometric Leptons report kelvin directly; others are estimated.
      $('info').textContent = Math.abs(offset + 273.15) < .01
        ? 'Tap or hover the image to probe a point.'
        : 'Tap or hover the image to probe a point. This Lepton isn\'t radiometric, so temperatures are estimates.';
      const t = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) t[i] = raw[i] * scale + offset;
      frames++;
      ingest({ w, h, t });
    };
  }

  setInterval(() => {
    const now = performance.now();
    $('fps').textContent = frozen ? 'Paused' : (frames * 1000 / (now - fpsT)).toFixed(1) + ' fps';
    frames = 0; fpsT = now;
    if (ws && ws.readyState === 1 && now - lastMsg > 3000) setOverlay('No data from camera');
  }, 1000);

  // ---- Probe (hover / tap / drag) ----
  function probeAt(e) {
    if (!frame) return;
    const r = view.getBoundingClientRect();
    // Position within the canvas's own (unrotated) box, in CSS px.
    const lx = rotated ? e.clientY - r.top : e.clientX - r.left;
    const ly = rotated ? r.right - e.clientX : e.clientY - r.top;
    const L = layout(), ux = lx / cssScale, uy = ly / cssScale;
    if (ux < IMG_X || ux > IMG_X + L.imgW || uy < IMG_Y || uy > IMG_Y + IMG_H) { probe = null; draw(); return; }
    probe = { x: (ux - IMG_X) / L.imgW * frame.w, y: (uy - IMG_Y) / IMG_H * frame.h };
    draw();
  }
  view.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) probeAt(e); });
  view.addEventListener('pointerdown', e => { try { view.setPointerCapture(e.pointerId); } catch {} probeAt(e); });
  view.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { probe = null; draw(); } });

  // ---- Fullscreen (landscape) ----
  const canFullscreen = !!(stage.requestFullscreen || stage.webkitRequestFullscreen);
  function applyFsLayout() {
    rotated = fsMode && innerHeight > innerWidth;
    stage.classList.toggle('rot', rotated);
    if (rotated) {
      Object.assign(stage.style, { width: innerHeight + 'px', height: innerWidth + 'px',
                                   transform: `translateX(${innerWidth}px) rotate(90deg)` });
    } else {
      Object.assign(stage.style, { width: '', height: '', transform: '' });
    }
    draw();
  }
  async function enterFullscreen() {
    fsMode = true;
    stage.classList.add('fs'); document.body.classList.add('fs-active');
    try {
      if (stage.requestFullscreen) await stage.requestFullscreen({ navigationUI: 'hide' });
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
    } catch {}
    try { await screen.orientation.lock('landscape'); } catch {}
    applyFsLayout();
  }
  function exitFullscreen() {
    if (!fsMode) return;
    fsMode = false;
    stage.classList.remove('fs'); document.body.classList.remove('fs-active');
    try { screen.orientation.unlock(); } catch {}
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    applyFsLayout();
  }
  $('bFullscreen').onclick = enterFullscreen;
  $('bExitFs').onclick = exitFullscreen;
  const onFsChange = () => { if (canFullscreen && !(document.fullscreenElement || document.webkitFullscreenElement)) exitFullscreen(); };
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && fsMode && !$('settings').open) exitFullscreen(); });
  window.addEventListener('resize', () => fsMode ? applyFsLayout() : draw());

  // ---- Settings dialog ----
  const dlg = $('settings');
  const openSettings = () => { syncUi(); dlg.showModal(); };
  $('bSettings').onclick = openSettings;
  $('bSettingsFs').onclick = openSettings;
  $('bCloseSettings').onclick = () => dlg.close();
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });  // backdrop click

  const palBox = $('palettes');
  for (const name of Object.keys(PALETTES)) {
    const b = document.createElement('button');
    b.textContent = name; b.dataset.palette = name;
    b.onclick = () => { S.palette = name; save(); syncUi(); draw(); };
    palBox.appendChild(b);
  }
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => {
    if (b.dataset.range === S.range) return;
    S.range = b.dataset.range;
    if (S.range === 'manual' && !isNaN(lo)) { const [a, c] = colourRange(); S.rMin = +a.toFixed(1); S.rMax = +c.toFixed(1); }
    if (S.range === 'auto') lo = hi = NaN;
    save(); syncUi(); if (rawLast) ingest(rawLast);
  });
  const onRange = () => {
    const a = fromU(parseFloat($('rMin').value)), b = fromU(parseFloat($('rMax').value));
    if (isNaN(a) || isNaN(b) || b <= a) return;
    S.rMin = a; S.rMax = b; save(); if (rawLast) ingest(rawLast);
  };
  $('rMin').onchange = onRange; $('rMax').onchange = onRange;

  const toggle = (id, key) => $(id).onclick = () => { S[key] = !S[key]; save(); syncUi(); if (rawLast) ingest(rawLast); else draw(); };
  toggle('tSmooth', 'smooth'); toggle('tMirror', 'mirror'); toggle('tMarkers', 'markers');
  $('tUnits').onclick = () => { S.fahrenheit = !S.fahrenheit; save(); syncUi(); draw(); };
  $('tRotate').onclick = () => {
    S.rotate = (S.rotate + 90) % 360; probe = null; save(); syncUi();
    if (rawLast) ingest(rawLast); else draw();
  };

  function syncUi() {
    palBox.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.palette === S.palette));
    document.querySelectorAll('[data-range]').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === S.range));
    $('rMin').disabled = $('rMax').disabled = S.range === 'auto';
    if (S.range === 'manual') { $('rMin').value = toU(S.rMin).toFixed(1); $('rMax').value = toU(S.rMax).toFixed(1); }
    $('tUnits').textContent = unit();
    $('tSmooth').setAttribute('aria-pressed', S.smooth);
    $('tMirror').setAttribute('aria-pressed', S.mirror);
    $('tMarkers').setAttribute('aria-pressed', S.markers);
    $('tRotate').setAttribute('aria-pressed', S.rotate !== 0);
    $('tRotate').textContent = S.rotate ? `Rotate ${S.rotate}°` : 'Rotate';
  }

  // ---- Capture ----
  const stamp = () => new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('bSnap').onclick = () => view.toBlob(b => b && download(b, `thermal-${stamp()}.png`), 'image/png');
  $('bCsv').onclick = () => {
    if (!frame) return;
    const rows = [];
    for (let y = 0; y < frame.h; y++) rows.push(Array.from(frame.t.slice(y * frame.w, (y + 1) * frame.w), v => toU(v).toFixed(2)).join(','));
    download(new Blob([`# ${unit()}, ${frame.w}x${frame.h}, ${new Date().toISOString()}\n` + rows.join('\n') + '\n'], { type: 'text/csv' }),
             `thermal-${stamp()}.csv`);
  };
  let rec = null;
  $('bRec').onclick = () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || !window.MediaRecorder) { $('info').textContent = 'Recording is not supported in this browser.'; return; }
    const type = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const chunks = [];
    rec = new MediaRecorder(view.captureStream(15), type ? { mimeType: type } : {});
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const t = rec.mimeType || type || 'video/webm';
      download(new Blob(chunks, { type: t }), `thermal-${stamp()}.${t.includes('mp4') ? 'mp4' : 'webm'}`);
      rec = null; $('bRec').textContent = 'Record'; $('bRec').classList.remove('rec');
    };
    rec.start(1000);
    $('bRec').textContent = 'Stop'; $('bRec').classList.add('rec');
  };

  syncUi(); draw(); connect();
})();
</script>
</body>
</html>
